aid: friendster
name: Friendster
description: Friendster is a mobile-first social network for real-life friends, operating at friendster.com
  with a native iOS app and a web experience. The service positions itself around privacy and intentional
  design — no ads, no algorithms, no spam, and an explicit promise never to sell user data — and centers
  on connecting people with the friends they actually know in real life. It was surfaced as a portfolio
  company of Battery Ventures and added to the API Evangelist network as a stub. As of this enrichment
  pass Friendster publishes a consumer marketing site and a native iOS app, but exposes no public developer
  program, API, OpenAPI, or documentation surface — so there are no API artifacts to harvest, only company
  identity and live domain-security posture.
